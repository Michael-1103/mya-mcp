# Exemple simple (volume nommé). Définir MCP_AUTH_TOKEN dans l'environnement ou dans un fichier .env :
#   export MCP_AUTH_TOKEN=$(openssl rand -hex 32)
#   docker compose up -d --build
services:
  mya-mcp:
    build: .
    image: mya-mcp:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Définir MCP_AUTH_TOKEN (openssl rand -hex 32)}
      REFRESH_HOUR_UTC: ${REFRESH_HOUR_UTC:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - mya-data:/data

volumes:
  mya-data:
